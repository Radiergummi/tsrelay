extends: existence
message: "Use plain ASCII punctuation instead of '%s': a comma, colon, parentheses, a new sentence, or 'to'."
level: error
nonword: true
# Plain text only: no em dashes, arrows, typographic quotes or ellipses, and
# no emoji. They render differently across terminals and fonts, and a docs
# page doesn't need them. Code spans and blocks are not checked.
tokens:
  - '[—–]'
  - '[→←↔⇒⇐⇔➜➔]'
  - '[“”‘’]'
  - '…'
  - '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B50}\x{2705}]'
