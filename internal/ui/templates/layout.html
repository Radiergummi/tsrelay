{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} · tsrelay</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header>
<a class="brand" href="/">tsrelay</a>
{{with .V.ID.NodeName}}<nav>
<a href="/">Hooks</a>
{{if $.V.Admin}}<a href="/admin">Admin</a>{{end}}
<span class="who">{{with $.V.ID.Login}}{{.}}{{else}}{{join $.V.ID.Tags ", "}}{{end}} on {{.}}</span>
</nav>{{end}}
</header>
<main>
<p id="flash" class="flash" role="status" hidden></p>
{{template "content" .}}
</main>
</body>
</html>{{end}}
