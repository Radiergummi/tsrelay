# Prose linting for the published docs and the website's own pages; `make
# lint-docs` runs it. The Google and proselint styles are fetched and
# checksummed by the Makefile, and gitignored.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tsrelay

[*.{md,html}]
BasedOnStyles = Vale, Google, proselint, Tsrelay

# The docs list without a serial comma ("sender, relay and your app").
Google.OxfordComma = NO

# Google's product and mobile vocabulary ("APIs Explorer", "tap"), which trips
# on third-party names.
Google.WordList = NO
Google.WordListCase = NO

# Flags GitHub's `> [!NOTE]` alerts; Tsrelay.Placeholders takes its place.
proselint.Annotations = NO

# Suggests typographic ellipses and symbols; Tsrelay.Typography wants plain
# ASCII instead.
proselint.Typography = NO

# Errors fail the build and warnings only annotate. Headings are part of what
# keeps the pages uniform, so they fail it too.
Google.Headings = error
