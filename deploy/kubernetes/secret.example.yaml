# Copy to secret.yaml, fill in the value, and apply it before the
# StatefulSet, in the same namespace. Use the secret of an OAuth client with
# the auth_keys write scope that may assign tag:tsrelay
# (https://tsrelay.mazetti.me/running-a-relay). Keep the
# ?ephemeral=false&preauthorized=true suffix: without it the relay joins as an
# ephemeral device, which the tailnet removes once it has been offline.
apiVersion: v1
kind: Secret
metadata:
  name: tsrelay-tailscale
type: Opaque
stringData:
  TS_CLIENT_SECRET: "tskey-client-REPLACE-ME?ephemeral=false&preauthorized=true"
