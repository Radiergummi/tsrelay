# Copy to secret.yaml, fill in the value, and apply it before the
# StatefulSet. Use an OAuth client secret with the tag:tsrelay tag
# (README.md "Run the relay"); it does not expire, unlike an auth key.
apiVersion: v1
kind: Secret
metadata:
  name: tsrelay-tailscale
  namespace: default
type: Opaque
stringData:
  TS_CLIENT_SECRET: "tskey-client-REPLACE-ME"
