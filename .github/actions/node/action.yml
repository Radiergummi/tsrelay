name: Node and pnpm
description: Sets up Node from web/.nvmrc and pnpm from web/package.json's packageManager, with a cached store, and installs web/'s dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: web/.nvmrc

    - name: Enable pnpm through corepack
      shell: bash
      working-directory: web
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: corepack enable && pnpm --version

    - name: Find the pnpm store
      id: store
      shell: bash
      working-directory: web
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
