# Dependabot keeps the Go modules, the pinned actions and the container base
# images current. Minor and patch updates of each ecosystem arrive as one
# pull request a week; major updates come one at a time.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
