name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI on the tagged commit before building it.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - name: Lint, format, types and unit tests
        working-directory: web
        run: |
          pnpm lint
          pnpm fmt:check
          pnpm typecheck
          pnpm test
          pnpm check:sinks

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Bundle budget
        working-directory: web
        run: pnpm budget

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt needs to be run on the files above"
            exit 1
          fi

      - name: go test -race
        run: go test -race ./...

      - name: benchmarks run
        run: go test -run='^$' -bench=. -benchtime=1x ./...

      - name: tailnet integration test
        run: go test -race -tags tailnet ./internal/server

  # Background tunnels detach, signal and stop processes differently per
  # system, so their tests run on each.
  background:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: background tunnel tests
        run: go test -run '^TestBackground' ./cmd/tsrelay

  # Builds the SBOM and license texts the binary embeds, which are not
  # committed, and tests them. The release embeds this job's artifact.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - uses: ./.github/actions/node

      - name: Build
        run: ./scripts/build-sbom.sh

      # These packages skip their attribution tests without an SBOM, and
      # run them here.
      - name: Test
        run: go test ./internal/sbom/ ./internal/api/ ./internal/server/ ./cmd/tsrelay/ ./scripts/...

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: internal/sbom/generated
          if-no-files-found: error
          retention-days: 7

  # Builds the release image for both platforms without pushing it, so a
  # broken Dockerfile fails here rather than on a tag.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - uses: ./.github/actions/node

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        working-directory: web
        env:
          CI: 'true'
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
