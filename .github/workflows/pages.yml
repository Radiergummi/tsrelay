name: Website

on:
  push:
    branches: [main]
    paths: &paths
      - "docs/**"
      - "website/**"
      # The API reference is rendered from this.
      - "internal/api/openapi.yaml"
      - ".github/workflows/pages.yml"
      - ".github/actions/node/**"
  pull_request:
    paths: *paths
  # The release workflow dispatches this on main once a release is
  # published, since that changes the version the site offers for download.
  workflow_dispatch:

# Read-only by default: the build installs dependencies and runs the Astro
# build, and must not hold a scope that can publish. deploy takes the write
# scopes on its own.
permissions:
  contents: read

# A newer pull request push makes an older check moot, but a deploy that is
# under way is left to finish rather than cut off halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every page's modified date comes from the last commit that touched
          # its source, so the build needs the whole history; it refuses a
          # shallow clone rather than date every page by the deploy.
          fetch-depth: 0

      - uses: ./.github/actions/node
        with:
          working-directory: website

      - name: Lint, format and types
        working-directory: website
        run: |
          pnpm lint
          pnpm fmt:check
          pnpm check

      - name: Build
        working-directory: website
        env:
          # Read once, for the latest release's version.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      # The pages whose copy is in components rather than docs/, as built;
      # make lint-docs in CI checks the docs themselves.
      - uses: ./.github/actions/vale

      - run: make lint-site

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
