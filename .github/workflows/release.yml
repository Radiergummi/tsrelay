name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Releases are immutable once published, so the release starts as a draft:
  # the binaries are uploaded to it, and the last job publishes it. One job
  # creates it, so the matrix jobs do not race to.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - name: Build the web UI
        working-directory: web
        run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  binaries:
    needs: [create-release, web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="dist/tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" ./cmd/tsrelay
          (cd dist && sha256sum "tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}${ext}" > "tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}.sha256")

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*

  # The image is attested, so it builds without a cache: a tag run resolves
  # caches against the default branch, which would make a cache one input to
  # an attested image that the tag itself never built. CI builds the image
  # with a cache on every push instead.
  docker:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository has no license GitHub recognises, and its description
      # is longer than the image's, so both are set here rather than taken
      # from the repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/radiergummi/tsrelay
          labels: |
            org.opencontainers.image.description=Deliver HTTP callbacks from your tailnet to apps on your laptop
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.description=Deliver HTTP callbacks from your tailnet to apps on your laptop
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # A pre-release (v1.0.0-rc.1) must not move :latest for everyone
            # running the plain image.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/radiergummi/tsrelay
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishing makes the release, its assets and its tag immutable, so it
  # waits for the binaries and the image.
  publish-release:
    needs: [binaries, docker]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
