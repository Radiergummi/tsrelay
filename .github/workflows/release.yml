name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Releases are immutable once published, so the release starts as a draft:
  # the binaries are uploaded to it, and the last job publishes it. One job
  # creates it, so the matrix jobs do not race to.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - name: Build the web UI
        working-directory: web
        run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  binaries:
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: Build
        id: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="dist/tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" ./cmd/tsrelay
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error

  # Signs and notarizes the macOS binaries with the Developer ID certificate,
  # then checksums, attests and uploads all of them. It is the only job that
  # can read the signing secrets: they live in the release environment,
  # which only v* tags can deploy to. The build jobs compile third-party
  # code, so they never see them.
  publish-binaries:
    needs: [create-release, binaries]
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      RCODESIGN_VERSION: '0.29.0'
      RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Install rcodesign
        run: |
          name="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/rcodesign.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${name}.tar.gz"
          echo "${RCODESIGN_SHA256}  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP" "${name}/rcodesign"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"

      - name: Write the signing credentials
        env:
          MACOS_P12: ${{ secrets.MACOS_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
        run: |
          printf %s "$MACOS_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          printf %s "$MACOS_P12_PASSWORD" > "$RUNNER_TEMP/cert.pass"
          printf %s "$ASC_API_KEY_JSON" > "$RUNNER_TEMP/asc-key.json"

      # --for-notarization turns on the hardened runtime and a secure
      # timestamp, and refuses anything but a Developer ID certificate. The
      # identifier is set so both architectures share one, rather than each
      # taking its file name. A bare binary cannot have its ticket stapled,
      # so both go to Apple in one zip, notarized in a single submission,
      # and macOS checks them online on first launch.
      - name: Sign and notarize
        working-directory: dist
        run: |
          for f in tsrelay_darwin_*; do
            rcodesign sign --for-notarization \
              --p12-file "$RUNNER_TEMP/cert.p12" --p12-password-file "$RUNNER_TEMP/cert.pass" \
              --binary-identifier com.radiergummi.tsrelay "$f"
          done
          zip -q "$RUNNER_TEMP/darwin.zip" tsrelay_darwin_*
          rcodesign notary-submit --api-key-file "$RUNNER_TEMP/asc-key.json" --wait "$RUNNER_TEMP/darwin.zip"

      - name: Remove the signing credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pass" "$RUNNER_TEMP/asc-key.json"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tsrelay_*

      # The install scripts fetch tsrelay_<os>_<arch>.sha256, without .exe.
      - name: Write the checksums
        working-directory: dist
        run: for f in tsrelay_*; do sha256sum "$f" > "${f%.exe}.sha256"; done

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*

  # The image is attested, so it builds without a cache: a tag run resolves
  # caches against the default branch, which would make a cache one input to
  # an attested image that the tag itself never built. CI builds the image
  # with a cache on every push instead.
  docker:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository has no license GitHub recognises, and its description
      # is longer than the image's, so both are set here rather than taken
      # from the repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/radiergummi/tsrelay
          labels: |
            org.opencontainers.image.description=Deliver HTTP callbacks from your tailnet to apps on your laptop
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.description=Deliver HTTP callbacks from your tailnet to apps on your laptop
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # A pre-release (v1.0.0-rc.1) must not move :latest for everyone
            # running the plain image.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/radiergummi/tsrelay
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishing makes the release, its assets and its tag immutable, so it
  # waits for the binaries and the image.
  publish-release:
    needs: [publish-binaries, docker]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
