name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is built or published until the tagged commit passes CI. Its
  # web-dist and sbom artifacts are the web UI and the attribution the
  # binaries and the image embed.
  ci:
    uses: ./.github/workflows/ci.yml

  # Releases are immutable once published, so the release starts as a draft:
  # the binaries are uploaded to it, and the last job publishes it. One job
  # creates it, so the matrix jobs do not race to.
  create-release:
    needs: [ci]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # A pre-release tag (v1.0.0-rc.1) is marked as one, so neither GitHub's
        # latest release nor the installers and update check pick it up.
        run: gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}

  binaries:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: internal/sbom/generated

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      # Fills in the Details tab of the .exe's properties. Windows wants a
      # numeric version there, so v0.3.0-rc.1 becomes 0.3.0.0, with the full
      # string next to it.
      - name: Embed the Windows version resource
        if: matrix.goos == 'windows'
        working-directory: cmd/tsrelay
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch "${{ matrix.goarch }}" --manifest cli \
            --product-name tsrelay --file-description tsrelay --original-filename tsrelay.exe \
            --product-version "${GITHUB_REF_NAME#v}" --file-version "${GITHUB_REF_NAME#v}" \
            --copyright "Copyright Moritz Mazetti"

      - name: Build
        id: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="dist/tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" ./cmd/tsrelay
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error

  # Signs and notarizes the macOS binaries with the Developer ID certificate,
  # then checksums, attests and uploads all of them. It is the only job that
  # can read the signing secrets: they live in the release environment,
  # which only v* tags can deploy to. The build jobs compile third-party
  # code, so they never see them.
  publish-binaries:
    needs: [create-release, binaries]
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      APPLE_RCODESIGN_VERSION: '0.29.0'
      APPLE_RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Install rcodesign
        run: |
          name="apple-codesign-${APPLE_RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/rcodesign.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_RCODESIGN_VERSION}/${name}.tar.gz"
          echo "${APPLE_RCODESIGN_SHA256}  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP" "${name}/rcodesign"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"

      - name: Write the signing credentials
        env:
          MACOS_P12: ${{ secrets.MACOS_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
        run: |
          printf %s "$MACOS_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          printf %s "$MACOS_P12_PASSWORD" > "$RUNNER_TEMP/cert.pass"
          printf %s "$ASC_API_KEY_JSON" > "$RUNNER_TEMP/asc-key.json"

      # --for-notarization turns on the hardened runtime and a secure
      # timestamp, and refuses anything but a Developer ID certificate. The
      # identifier is set so both architectures share one, rather than each
      # taking its file name. A bare binary cannot have its ticket stapled,
      # so both go to Apple in one zip, notarized in a single submission,
      # and macOS checks them online on first launch.
      - name: Sign and notarize
        working-directory: dist
        run: |
          for f in tsrelay_darwin_*; do
            rcodesign sign --for-notarization \
              --p12-file "$RUNNER_TEMP/cert.p12" --p12-password-file "$RUNNER_TEMP/cert.pass" \
              --binary-identifier com.radiergummi.tsrelay "$f"
          done
          zip -q "$RUNNER_TEMP/darwin.zip" tsrelay_darwin_*
          rcodesign notary-submit --api-key-file "$RUNNER_TEMP/asc-key.json" --wait "$RUNNER_TEMP/darwin.zip"

      - name: Remove the signing credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pass" "$RUNNER_TEMP/asc-key.json"

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tsrelay_*

      # The install scripts fetch tsrelay_<os>_<arch>.sha256, without .exe.
      # The provenance bundle goes along, so the binaries verify without
      # GitHub's attestation API (gh attestation verify --bundle).
      - name: Write the checksums
        working-directory: dist
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for f in tsrelay_*; do sha256sum "$f" > "${f%.exe}.sha256"; done
          cp "$BUNDLE" tsrelay.provenance.sigstore.json

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*

  # Attests an SBOM for each published binary: the modules it was built
  # from, read from the build info Go embeds in it. It reads the signed
  # macOS binaries back from the draft release, and builds cyclonedx-gomod,
  # so it runs apart from the job holding the signing secrets.
  sboms:
    needs: [publish-binaries]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      NAME: tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}
      BIN: tsrelay_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      # cyclonedx-gomod reads the build info with go version -m, which only
      # takes executable files.
      - name: Write the SBOM
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern "$BIN" --dir dist
          chmod +x "dist/$BIN"
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 bin \
            -json -version "${GITHUB_REF_NAME}" -output "dist/$NAME.cdx.json" "dist/$BIN"

      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.BIN }}
          sbom-path: dist/${{ env.NAME }}.cdx.json

      - name: Upload to the draft release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/$NAME.sbom.sigstore.json"
          gh release upload "${GITHUB_REF_NAME}" "dist/$NAME.cdx.json" "dist/$NAME.sbom.sigstore.json"

  # The image is attested, so it builds without a cache: a tag run resolves
  # caches against the default branch, which would make a cache one input to
  # an attested image that the tag itself never built. CI builds the image
  # with a cache on every push instead.
  docker:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile builds the web UI itself, but not the SBOM: it is
      # copied in with the rest of the build context.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: internal/sbom/generated

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository has no license GitHub recognises, and its description
      # is longer than the image's, so both are set here rather than taken
      # from the repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/radiergummi/tsrelay
          labels: |
            org.opencontainers.image.description=Deliver HTTP callbacks from your tailnet to apps on your laptop
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.description=Deliver HTTP callbacks from your tailnet to apps on your laptop
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # A pre-release (v1.0.0-rc.1) must not move :latest for everyone
            # running the plain image.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/radiergummi/tsrelay
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishing makes the release, its assets and its tag immutable, so it
  # waits for the binaries, their SBOMs and the image.
  publish-release:
    needs: [publish-binaries, sboms, docker]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false ${{ !contains(github.ref_name, '-') && '--latest' || '--latest=false' }}
